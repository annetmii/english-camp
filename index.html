<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>annetmii English Camp</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#fafafa; }
    .container { max-width: 760px; margin: 0 auto; padding: 16px; }
    .card { border:1px solid #eee; border-radius:8px; background:#fff; padding:12px; margin-top:12px; }
    .title { font-size:22px; font-weight:700; margin:0; }
    .row { display:grid; gap:6px; }
    .input, .ta { border:1px solid #ccc; border-radius:6px; padding:8px; width:100%; }
    .ta { min-height:80px; }
    .btn { padding:8px 12px; border:1px solid #ccc; border-radius:8px; background:#fff; cursor:pointer; }
    .sticky { position:sticky; top:0; background:white; z-index:5; border-bottom:1px solid #eee; padding-bottom:8px; }
    .muted { font-size:12px; color:#666; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
