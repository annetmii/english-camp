# netlify.toml

[build]
  command = "npm run build"
  publish = "dist"
  ignore = """
  if [ -z "$CACHED_COMMIT_REF" ]; then
    echo 'No cached commit → build';
    exit 1
  fi
  CHANGED=$(git diff --name-only "$CACHED_COMMIT_REF" "$COMMIT_REF" || true)
  NONCAMP=$(echo "$CHANGED" | grep -vE '^(camp/|README.md$)' || true)
  if [ -z "$NONCAMP" ]; then
    echo 'Data-only change (camp/*) → skip build';
    exit 0
  else
    echo 'Code change detected → build';
    exit 1
  fi
  """

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ★追加：Functionsのレスポンスを中間キャッシュさせない（安全側）
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

# ★追加：JSON配信のMIMEを明示（必要に応じて）
[[headers]]
  for = "/camp/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "no-cache"

# SPA ルーティング
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
